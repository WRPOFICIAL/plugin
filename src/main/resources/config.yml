# SurvivalCore+ Config
# Desarrollado por WRP (Wyl & Ari)

modules:
  teleport: true
  homes: true
  graves: true
  build: true
  tabsystem: true

teleport:
  delay: 3
  cancel-on-move: true
  cancel-on-damage: true
  combat-block: true # Bloqueo si está en combate (Requiere integración opcional o cooldown interno)

homes:
  default-limit: 1
  # Límites por permiso: survivalcore.homes.<rango>
  limits:
    vip: 3
    staff: 100

graves:
  use-player-head: true
  despawn-minutes: 15
  particles: true
  give-compass: true

messages:
  prefix: "<grey>[<green>Survival</green>]</grey> "
  teleport-start: "<yellow>Teletransportando en <count> segundos...</yellow>"
  teleport-success: "<green>✔ Teletransportado con éxito.</green>"
  teleport-cancelled-move: "<red>✖ Teletransporte cancelado por movimiento.</red>"
  teleport-cancelled-damage: "<red>✖ Teletransporte cancelado por daño.</red>"
  home-saved: "<green>✔ Hogar guardado correctamente.</green>"
  home-deleted: "<green>✔ Hogar eliminado correctamente.</green>"
  no-permission: "<red>✖ No tienes permiso.</red>"
  grave-created: "<red>☠ Tumba creada en tu posición de muerte.</red>"
  grave-hologram: "<red>☠ Tumba de <player></red>"

silent-mode: false

shop:
  title: "<dark_aqua>Tienda SurvivalCore+</dark_aqua>"
  items:
    diamond:
      material: DIAMOND
      name: "Diamante"
      buy-price: 500
      sell-price: 100
      slot: 10
    gold_ingot:
      material: GOLD_INGOT
      name: "Lingote de Oro"
      buy-price: 200
      sell-price: 40
      slot: 11
    iron_ingot:
      material: IRON_INGOT
      name: "Lingote de Hierro"
      buy-price: 100
      sell-price: 20
      slot: 12
    upgrade_core:
      material: NETHER_STAR
      name: "<gold>Núcleo de Mejora</gold>"
      buy-price: 5000
      sell-price: 0
      slot: 13
      special: upgrade_core
