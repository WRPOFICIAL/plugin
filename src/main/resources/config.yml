# ══════════════════════════════════════════════════════════════════════════
# SURVIVALCORE+ CONFIGURATION (WRP NETWORK)
# ══════════════════════════════════════════════════════════════════════════
# Desarrollado por Wyl & Ari.
# Licencia Privada - Uso exclusivo.
# ══════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════
# GUÍA DE PERMISOS (WRP · PERMISSIONS)
# ══════════════════════════════════════════════════════════════════════════
# - survivalcore.admin: Acceso a todos los comandos de administración.
# - survivalcore.fly: Permiso para volar (/fly).
# - survivalcore.repair: Permiso para reparar (/repair).
# - survivalcore.buildmode: Permiso para modo construcción.
# - survivalcore.homes.vip: Límite extendido de hogares.
# - survivalcore.protection.bypass: Ignorar protecciones de otros.
# - survivalcore.clan.create: Crear clanes.
# ══════════════════════════════════════════════════════════════════════════

# Activa o desactiva los módulos principales del plugin.
modules:
  teleport: true
  homes: true
  graves: true
  build: true
  tabsystem: true

teleport:
  delay: 3
  cancel-on-move: true
  cancel-on-damage: true
  combat-block: true # Bloqueo si está en combate (Requiere integración opcional o cooldown interno)

# ══════════════════════════════════════════════════════════════════════════
# SISTEMA DE HOGARES Y PROTECCIÓN
# ══════════════════════════════════════════════════════════════════════════
homes:
  # Límite de hogares para usuarios sin permisos especiales.
  default-limit: 1

  # Límites personalizados por permisos. Ej: survivalcore.homes.vip
  limits:
    vip: 3
    staff: 100

  # Radios de protección (en bloques) según el nivel del hogar.
  radii:
    level-1: 10
    level-2: 20
    level-3: 30

  # Los bloques que aparecerán físicamente en el centro de la protección.
  # Representan visualmente el nivel actual del hogar.
  core-blocks:
    level-1: COPPER_BLOCK
    level-2: IRON_BLOCK
    level-3: GOLD_BLOCK

  # Configuración del objeto físico necesario para subir de nivel una zona.
  upgrade-item:
    material: NETHER_STAR
    name: "<gold>✨ Núcleo de Mejora de Hogar ✨</gold>"
    lore:
      - "<grey>Usa este núcleo en tu zona para subir de nivel.</grey>"
      - "<yellow>¡Aumenta tu radio de protección!</yellow>"

graves:
  use-player-head: true
  despawn-minutes: 15
  particles: true
  give-compass: true

# ══════════════════════════════════════════════════════════════════════════
# MENSAJES Y TRADUCCIONES
# ══════════════════════════════════════════════════════════════════════════
messages:
  prefix: "<dark_grey>┃ <gradient:#55ff55:#aaffaa><b>SurvivalCore+</b></gradient> <dark_grey>»</dark_grey> "
  teleport-start: "<yellow>⌛ Teletransportando en <count> segundos...</yellow>"
  teleport-success: "<green>✔ Teletransportado con éxito.</green>"
  teleport-cancelled-move: "<red>✖ Teletransporte cancelado por movimiento.</red>"
  teleport-cancelled-damage: "<red>✖ Teletransporte cancelado por daño.</red>"
  home-saved: "<green>✔ Hogar guardado correctamente.</green>"
  home-deleted: "<green>✔ Hogar eliminado correctamente.</green>"
  no-permission: "<red>✖ No tienes permiso.</red>"
  grave-created: "<red>☠ Tumba creada en tu posición de muerte.</red>"
  grave-hologram: "<red>☠ Tumba de <player></red>"

silent-mode: false

# ══════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DEL SISTEMA DE CLANES (WRP · CLANS)
# ══════════════════════════════════════════════════════════════════════════
# El sistema de clanes permite a los jugadores crear comunidades privadas,
# tener un hogar compartido y gestionar una economía grupal.
#
# INSTRUCCIONES DE USO:
# - /clan create <nombre> <lema>: Crea un nuevo clan con un tag único.
# - /clan invite <jugador>: Envía una invitación para unirse.
# - /clan bank: Gestiona el dinero del grupo.
# ══════════════════════════════════════════════════════════════════════════

clans:
  enabled: true

  # chat-format: Define cómo se verá el tag del clan en el chat.
  # Soporta MiniMessage (Hex/Gradients).
  chat-format: "<grey>[<aqua>%tag%</aqua>] </grey>%player%: %message%"

  # Límites de caracteres para mantener el chat limpio y profesional.
  max-name-length: 16
  max-tag-length: 5

  # Configuración de Rangos Internos:
  # LEADER: Control total del clan y el banco.
  # MEMBER: Puede usar el hogar del clan y depositar dinero.

  # Sistema de Hogares de Clan:
  # Permite teletransporte grupal coordinado.
  clan-home-enabled: true

# ══════════════════════════════════════════════════════════════════════════
# SISTEMA DE TIENDA Y ECONOMÍA (WRP · SHOP)
# ══════════════════════════════════════════════════════════════════════════
# La tienda se divide en COMPRA (vía NPCs) y VENTA (vía comando /tienda).
# ══════════════════════════════════════════════════════════════════════════
# SISTEMA DE TIENDA Y ECONOMÍA (WRP · SHOP)
# ══════════════════════════════════════════════════════════════════════════
# La tienda se divide en COMPRA (vía NPCs) y VENTA (vía comando /tienda).
# Los NPCs abren las categorías para comprar.
# El comando /tienda abre las categorías para vender.
shop:
  title: "<dark_aqua>🛒 Tienda WRP · Compra</dark_aqua>"
  sell-title: "<dark_green>💰 Tienda WRP · Venta</dark_green>"
  category-title: "<dark_aqua>📂 Categorías de Tienda</dark_aqua>"

  categories:
    blocks:
      name: "<blue>Bloques</blue>"
      material: GRASS_BLOCK
      slot: 11
    materials:
      name: "<gold>Materiales</gold>"
      material: DIAMOND
      slot: 13
    special:
      name: "<red>Especial</red>"
      material: NETHER_STAR
      slot: 15

  # Lista de ítems disponibles.
  # material: Material de Minecraft (MAYÚSCULAS).
  # buy-price: Precio de compra al NPC (0 para desactivar compra).
  # sell-price: Precio de venta al servidor (0 para desactivar venta).
  # special: 'upgrade_core' para el ítem de mejora, dejar vacío para ítems normales.
  items:
    diamond:
      category: materials
      material: DIAMOND
      name: "Diamante"
      buy-price: 500
      sell-price: 100
      slot: 10
    gold_ingot:
      category: materials
      material: GOLD_INGOT
      name: "Lingote de Oro"
      buy-price: 200
      sell-price: 40
      slot: 11
    iron_ingot:
      category: materials
      material: IRON_INGOT
      name: "Lingote de Hierro"
      buy-price: 100
      sell-price: 20
      slot: 12
    upgrade_core:
      category: special
      material: NETHER_STAR
      name: "<gold>Núcleo de Mejora</gold>"
      buy-price: 5000
      sell-price: 0
      slot: 13
      special: upgrade_core
